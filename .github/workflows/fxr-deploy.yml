# FXR: build our n8n fork and deploy it to Azure Container Apps.
# Upstream n8n workflows in this folder are disabled in the repo settings.
name: 'FXR: Build & Deploy'

on:
  push:
    branches: [fxr]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        default: production
        options: [production, staging]

concurrency:
  group: fxr-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: fxrn8nacr.azurecr.io
  IMAGE: fxrn8nacr.azurecr.io/n8n
  NODE_VERSION: '24.15.0'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "tag=fxr-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "N8N_VERSION=$(node -p "require('./packages/cli/package.json').version")-fxr.${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Install and build n8n
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: 'pnpm build:n8n'
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=6144'

      # FXR custom nodes: built here and placed inside the compiled n8n tree, which the
      # upstream Dockerfile copies to /usr/local/lib/node_modules/n8n. n8n loads them via
      # N8N_CUSTOM_EXTENSIONS (set in the deploy job). No Dockerfile changes needed.
      # Compiled with the monorepo's own TypeScript and n8n-workflow build (tsconfig.ci.json maps
      # the import), so no package install is needed and nothing new goes through the registry.
      - name: Build FXR custom nodes
        run: |
          pnpm exec tsc -p fxr/nodes/netsuite/tsconfig.ci.json
          (cd fxr/nodes/netsuite && node scripts/copy-assets.mjs)
          mkdir -p compiled/fxr-nodes/netsuite
          cp -R fxr/nodes/netsuite/dist/. compiled/fxr-nodes/netsuite/
          cp fxr/nodes/netsuite/package.json compiled/fxr-nodes/netsuite/
          find compiled/fxr-nodes -type f | head -20

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name fxrn8nacr

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ env.N8N_VERSION }}
            N8N_RELEASE_TYPE=stable
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:fxr-latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    name: Deploy ${{ inputs.environment || 'production' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update container apps (main + worker if configured)
        env:
          APP: ${{ vars.CONTAINERAPP_NAME || 'n8n-app' }}
          WORKER: ${{ vars.CONTAINERAPP_WORKER_NAME }}
          RG: ${{ vars.CONTAINERAPP_RG || 'n8n-rg' }}
          # FXR-authored backend modules to enable (comma separated). Set with the image so
          # an env change never lands on an image that lacks the module.
          ENABLED_MODULES: ${{ vars.N8N_ENABLED_MODULES || 'fxr-sharing,fxr-projects,fxr-sso' }}
          # Directory inside the image holding FXR custom node packages (see build job).
          CUSTOM_EXTENSIONS: /usr/local/lib/node_modules/n8n/fxr-nodes
        run: |
          SUFFIX="$(echo '${{ needs.build.outputs.tag }}' | tr -c 'a-z0-9\n' '-')"
          for A in "$APP" $WORKER; do
            echo "deploying $A"
            az containerapp update -g "$RG" -n "$A" \
              --image "${IMAGE}:${{ needs.build.outputs.tag }}" \
              --set-env-vars "N8N_ENABLED_MODULES=${ENABLED_MODULES}" "N8N_CUSTOM_EXTENSIONS=${CUSTOM_EXTENSIONS}" \
              --revision-suffix "$SUFFIX" \
              --query "properties.latestRevisionName" -o tsv
          done

      - name: Wait for healthy revisions
        env:
          APP: ${{ vars.CONTAINERAPP_NAME || 'n8n-app' }}
          WORKER: ${{ vars.CONTAINERAPP_WORKER_NAME }}
          RG: ${{ vars.CONTAINERAPP_RG || 'n8n-rg' }}
        run: |
          for A in "$APP" $WORKER; do
            ok=0
            for _ in $(seq 1 30); do
              STATE=$(az containerapp revision list -g "$RG" -n "$A" --query "[?properties.active].properties.healthState | [0]" -o tsv)
              echo "$A health: $STATE"
              [ "$STATE" = "Healthy" ] && { ok=1; break; }
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "$A did not become healthy"; exit 1; }
          done
