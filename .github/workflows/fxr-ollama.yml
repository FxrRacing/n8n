# FXR: deploy or update the Ollama Container App beside n8n. Manual trigger only.
name: 'FXR: Deploy Ollama'

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to pull (space separated)'
        default: 'llama3.2:3b'
      cpu:
        description: 'vCPU'
        default: '4'
      memory:
        description: 'Memory (e.g. 8Gi)'
        default: '8Gi'
      workload_profile:
        description: 'Workload profile name on the environment'
        default: 'Consumption'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Ollama
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          RG: ${{ vars.CONTAINERAPP_RG || 'n8n-rg' }}
          N8N_APP: ${{ vars.CONTAINERAPP_NAME || 'n8n-app' }}
          MODELS: ${{ inputs.models }}
          CPU: ${{ inputs.cpu }}
          MEMORY: ${{ inputs.memory }}
          WORKLOAD_PROFILE: ${{ inputs.workload_profile }}
        run: fxr/infra/ollama/deploy.sh
